[package]
name = "faizdb-cli"
description = "CLI tool, REPL, and Server runner for FaizDB"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "faizdb"
path = "src/main.rs"

[dependencies]
faizdb-core = { path = "../faizdb-core" }
faizdb-query = { path = "../faizdb-query" }
faizdb-vector = { path = "../faizdb-vector" }
faizdb-graph = { path = "../faizdb-graph" }
faizdb-security = { path = "../faizdb-security" }
faizdb-server = { path = "../faizdb-server" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
