[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "faizdb"
version = "0.1.0"
description = "Official Python SDK for FaizDB — The AI-Native Universal Multi-Model Database Engine"
authors = [
    { name = "Ahmad Faiz", email = "faiz@ict.house" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["faizdb", "database", "nosql", "vector", "ai", "hnsw", "graph", "grpc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Database :: Database Engines/Servers",
    "Development Status :: 4 - Beta",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ictdothouse/faizdb"
Repository = "https://github.com/ictdothouse/faizdb"
Documentation = "https://github.com/ictdothouse/faizdb/tree/main/docs"
"Bug Tracker" = "https://github.com/ictdothouse/faizdb/issues"

[tool.setuptools.packages.find]
where = ["."]
