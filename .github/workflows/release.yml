name: Release — Automated Multi-Platform Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: faizdb-linux-x86_64.tar.gz
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: faizdb-linux-arm64.tar.gz
            use_cross: true

          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: faizdb-macos-x86_64.tar.gz
            use_cross: false

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: faizdb-macos-arm64.tar.gz
            use_cross: false

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: faizdb-windows-x64.zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for ARM Linux)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/faizdb dist/ 2>/dev/null || cp target/${{ matrix.target }}/release/faizdb-cli dist/faizdb 2>/dev/null || cp target/release/faizdb dist/ 2>/dev/null || true
          tar -czf ${{ matrix.artifact_name }} -C dist .
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path target/${{ matrix.target }}/release/faizdb.exe) {
            Copy-Item target/${{ matrix.target }}/release/faizdb.exe dist/
          } elseif (Test-Path target/${{ matrix.target }}/release/faizdb-cli.exe) {
            Copy-Item target/${{ matrix.target }}/release/faizdb-cli.exe dist/faizdb.exe
          } elseif (Test-Path target/release/faizdb.exe) {
            Copy-Item target/release/faizdb.exe dist/
          }
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}
          (Get-FileHash ${{ matrix.artifact_name }} -Algorithm SHA256).Hash > ${{ matrix.artifact_name }}.sha256

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
