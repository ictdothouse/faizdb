[package]
name = "faizdb-server"
description = "Server for FaizDB — HTTP/REST API & MongoDB Wire Protocol (Port 27017)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
faizdb-core = { path = "../faizdb-core" }
faizdb-query = { path = "../faizdb-query" }
faizdb-vector = { path = "../faizdb-vector" }
faizdb-graph = { path = "../faizdb-graph" }
faizdb-security = { path = "../faizdb-security" }
serde = { workspace = true }
serde_json = { workspace = true }
bson = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { version = "0.6", features = ["timeout"] }
parking_lot = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }

[dev-dependencies]
tempfile = { workspace = true }
