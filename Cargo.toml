[workspace]
resolver = "2"
members = [
    "faizdb-core",
    "faizdb-query",
    "faizdb-vector",
    "faizdb-graph",
    "faizdb-security",
    "faizdb-server",
    "faizdb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ahmad Faiz <faiz@ict.house>"]
license = "Apache-2.0"
repository = "https://github.com/ictdothouse/faizdb"
description = "The AI-Native NoSQL Database Engine — Fast, Secure, Run Everywhere"
rust-version = "1.88"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bson = "2.13"

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Networking & gRPC
axum = { version = "0.8", features = ["ws"] }
tonic = "0.12"
prost = "0.13"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
hyper = "1.5"
futures-util = "0.3"

# Crypto & Security
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.10"
tokio-rustls = "0.26"
rcgen = "0.13"
argon2 = "0.5"
jsonwebtoken = "9.3"
pem = "3.0"

# Storage
crc32fast = "1.4"
lz4_flex = "0.11"
zstd = "0.13"
crossbeam-skiplist = "0.1"
parking_lot = "0.12"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.14"
rand = "0.9"

# Utilities
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.9"
memmap2 = "0.9"
dashmap = "6.1"
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
